<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影音库</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head>
<body>
<button id="sidebar-dismiss" class="sidebar-dismiss" aria-label="关闭侧栏"></button><aside class="sidebar" id="sidebar">
 <div class="brand"><span class="brand-mark" data-icon="disc"></span><strong>影音库</strong><span class="local-tag">本地</span></div>
 <nav aria-label="媒体分类">
  <button data-kind="all" class="selected"><span data-icon="grid"></span>全部媒体</button>
  <button data-kind="music"><span data-icon="music"></span>音乐</button>
  <button data-kind="video"><span data-icon="video"></span>视频</button>
  <button id="favorites"><span data-icon="heart"></span>我的收藏</button>
 </nav>
 <section class="side-section"><div class="side-title"><span>我的歌单</span><button id="playlist-new" class="icon-button" aria-label="新建歌单" title="新建歌单"><span data-icon="plus"></span></button></div><div id="playlists"></div></section>
 <section class="side-section"><div class="side-title"><span>文件夹</span><button id="add-side" class="icon-button" aria-label="添加媒体库" title="添加媒体库"><span data-icon="plus"></span></button></div><div id="libraries"></div></section>
 <div class="side-footer"><button id="sharing"><span class="share-icon" data-icon="share"></span><span>局域网共享<small id="share-dot">未开启</small></span><span class="connection-dot"></span></button></div>
</aside>
<main>
 <div class="topbar"><button id="sidebar-toggle" class="icon-button" aria-label="展开侧栏" aria-expanded="false" aria-controls="sidebar"><span data-icon="list"></span></button><label class="search-box"><span data-icon="search"></span><input id="search" placeholder="搜索音乐、视频、歌手…" aria-label="搜索媒体" type="search"></label><button id="scan" class="icon-button" aria-label="重新扫描" title="重新扫描；按住 Shift 强制重算哈希"><span data-icon="refresh"></span></button><button id="player" class="icon-button" aria-label="打开独立播放器" title="打开独立播放器"><span data-icon="external"></span></button></div>
 <header class="collection-header">
  <div class="collection-info"><div class="eyebrow"><span class="status-dot"></span><span id="collection-label">本地媒体库</span></div><h1 id="heading">全部媒体</h1><p id="summary" aria-live="polite">正在加载</p><div class="collection-actions"><button id="play-all" class="primary"><span data-icon="play"></span>开始播放</button><button id="add"><span data-icon="plus"></span>添加文件夹</button><div id="playlist-tools" hidden><button id="playlist-rename" class="icon-button" aria-label="重命名歌单" title="重命名歌单"><span data-icon="more"></span></button><button id="playlist-delete" class="icon-button" aria-label="删除歌单" title="删除歌单"><span data-icon="close"></span></button></div></div></div>
  <div id="collection-art" class="collection-art" aria-label="媒体封面"></div>
 </header>
 <div class="content-toolbar"><h2 id="content-heading">媒体</h2><span id="scan-status" role="status"></span><button id="cancel-scan" class="quiet" hidden>取消扫描</button><div class="view-switch" role="group" aria-label="显示方式"><button id="view-grid" class="icon-button selected" aria-label="封面视图" aria-pressed="true" title="封面视图"><span data-icon="grid"></span></button><button id="view-list" class="icon-button" aria-label="列表视图" aria-pressed="false" title="列表视图"><span data-icon="list"></span></button></div></div>
 <p id="error" role="status"></p><div id="list-heading" class="list-heading" hidden><span>#</span><span>媒体名称</span><span>歌手 / 类型</span><span>专辑 / 大小</span><span></span></div><div id="items" class="grid" aria-live="polite" aria-busy="true"><div class="loading-state"><span data-icon="refresh"></span>正在加载媒体</div></div><button id="more" hidden>加载更多</button>
 <div id="now-playing" hidden><span data-icon="music"></span><button id="now-resume"><span id="now-name">正在播放</span></button><button id="now-prev" class="icon-button" aria-label="上一首"><span data-icon="previous"></span></button><button id="now-toggle" class="icon-button" aria-label="暂停"><span data-icon="pause"></span></button><button id="now-next" class="icon-button" aria-label="下一首"><span data-icon="next"></span></button><button id="now-stop" class="icon-button" aria-label="停止播放"><span data-icon="close"></span></button></div>
</main>
<dialog id="playlist-dialog"><form id="playlist-form"><h2 id="playlist-dialog-title">新建歌单</h2><label>名称<input id="playlist-name" required maxlength="80" autocomplete="off"></label><p id="playlist-error" class="dialog-error" role="status"></p><menu><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></menu></form></dialog>
<dialog id="edit-dialog"><form id="edit-form"><h2>媒体资料</h2><label>显示名<input id="edit-title" required maxlength="256"></label><label>歌手<input id="edit-artist" maxlength="256"></label><label>专辑<input id="edit-album" maxlength="256"></label><label>SHA-256<input id="edit-hash" readonly></label><p id="edit-copies" class="hint"></p><div id="edit-playlist-box"><label>歌单<select id="edit-playlist"></select></label><button id="playlist-add-track" type="button">加入歌单</button></div><p id="edit-error" class="dialog-error" role="status"></p><menu><button id="edit-reset" type="button">重置资料</button><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></menu></form></dialog>
<dialog id="add-dialog"><form method="dialog"><h2>添加文件夹</h2><label>类型<select id="kind"><option value="all">音乐和视频</option><option value="music">音乐</option><option value="video">视频</option></select></label><menu><button value="cancel">取消</button><button value="add" class="primary">选择文件夹</button></menu></form></dialog>
<dialog id="share-dialog"><div class="dialog-title"><h2>局域网共享</h2><button id="share-close" aria-label="关闭共享设置">×</button></div><p id="share-state">未开启</p><label>端口<input id="port" type="number" min="1024" max="65535" value="8098"></label><div id="share-links"></div><p class="hint">仅在可信局域网使用；停止共享后链接失效。</p><p id="share-error" role="status"></p><div class="dialog-actions"><button id="share-stop" hidden>停止共享</button><button id="share-start" class="primary">开启共享</button></div></dialog><script src="ui.js"></script><script src="app.js"></script></body></html>
