<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><span>◉</span><strong>影音库</strong></div><nav><button data-kind="all" class="selected">全部媒体</button><button data-kind="music">♫ 音乐</button><button data-kind="video">▷ 视频</button><button id="favorites">☆ 收藏</button></nav><div class="side-title"><span>媒体库</span><button id="add-side" aria-label="添加媒体库">＋</button></div><div id="libraries"></div><div class="side-footer"><button id="sharing">局域网共享 <span id="share-dot">未开启</span></button></div></aside>
<main><header><div><h1 id="heading">全部媒体</h1><p id="summary"></p></div><button id="scan">重新扫描</button><button id="add">添加媒体库</button><button id="player" class="primary">打开播放器 ↗</button></header><div class="toolbar"><input id="search" placeholder="搜索名称、歌手、专辑" aria-label="搜索媒体"><span id="scan-status"></span><button id="cancel-scan" hidden>取消扫描</button></div><p id="error" role="status"></p><div id="items" class="grid"></div><button id="more" hidden>加载更多</button></main>
<dialog id="add-dialog"><form method="dialog"><h2>添加媒体库</h2><label>类型<select id="kind"><option value="all">音乐和视频</option><option value="music">音乐</option><option value="video">视频</option></select></label><menu><button value="cancel">取消</button><button value="add" class="primary">选择文件夹</button></menu></form></dialog>
<dialog id="share-dialog"><div class="dialog-title"><h2>局域网共享</h2><button id="share-close" aria-label="关闭共享设置">×</button></div><p id="share-state">未开启</p><label>端口<input id="port" type="number" min="1024" max="65535" value="8098"></label><div id="share-links"></div><p class="hint">仅在可信局域网使用；停止共享后链接失效。</p><p id="share-error" role="status"></p><div class="dialog-actions"><button id="share-stop" hidden>停止共享</button><button id="share-start" class="primary">开启共享</button></div></dialog><script src="app.js"></script></body></html>
