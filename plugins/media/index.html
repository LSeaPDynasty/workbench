<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="catalog.css"><link rel="stylesheet" href="library-ui.css"></head><body>
<aside><div class="brand"><span class="brand-icon" aria-hidden="true">♫</span><strong>影音库</strong></div><nav><button data-kind="all" class="selected">全部媒体</button><button data-kind="music">音乐</button><button data-kind="video">视频</button><button id="favorites">收藏</button></nav><div class="side-title"><span>歌单</span><button id="playlist-new" aria-label="新建歌单">＋</button></div><div id="playlists"></div><div class="side-title"><span>媒体库</span><button id="add-side" aria-label="添加媒体库">＋</button></div><div id="libraries"></div><div class="side-footer"><button id="sharing">局域网共享 <span id="share-dot">未开启</span></button></div></aside>
<main><header><div><h1 id="heading">全部媒体</h1><p id="summary"></p></div><button id="scan" title="增量扫描：文件未变化时复用已有哈希，不重读文件；按住 Shift 点击可强制重算全部哈希">重新扫描</button><button id="add" class="primary">添加媒体库</button><button id="player" >独立播放器 ↗</button></header><div id="now-playing" hidden><span class="pulse" aria-hidden="true"></span><button id="now-resume" type="button" title="回到播放器"><span id="now-name">正在播放</span></button><button id="now-prev" type="button" aria-label="上一首" title="上一首">⏮</button><button id="now-toggle" type="button" aria-label="暂停" title="暂停/继续">⏸</button><button id="now-next" type="button" aria-label="下一首" title="下一首">⏭</button><button id="now-stop" type="button" aria-label="停止播放" title="停止播放">×</button></div><div id="playlist-tools" hidden><button id="playlist-rename">重命名歌单</button><button id="playlist-delete">删除歌单</button></div><div class="toolbar"><input id="search" placeholder="搜索名称、歌手、专辑" aria-label="搜索媒体"><span id="scan-status"></span><button id="cancel-scan" hidden>取消扫描</button></div><p id="error" role="status"></p><div id="items" class="grid"></div><button id="more" hidden>加载更多</button></main>
<dialog id="playlist-dialog"><form id="playlist-form"><h2 id="playlist-dialog-title">新建歌单</h2><label>名称<input id="playlist-name" required maxlength="80" autocomplete="off"></label><p id="playlist-error" class="dialog-error" role="status"></p><menu><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></menu></form></dialog>
<dialog id="edit-dialog"><form id="edit-form"><h2>媒体资料</h2><label>显示名<input id="edit-title" required maxlength="256"></label><label>歌手<input id="edit-artist" maxlength="256"></label><label>专辑<input id="edit-album" maxlength="256"></label><label>SHA-256<input id="edit-hash" readonly></label><p id="edit-copies" class="hint"></p><div id="edit-playlist-box"><label>歌单<select id="edit-playlist"></select></label><button id="playlist-add-track" type="button">加入歌单</button></div><p id="edit-error" class="dialog-error" role="status"></p><menu><button id="edit-reset" type="button">重置资料</button><button value="cancel" formnovalidate>取消</button><button value="save" class="primary">保存</button></menu></form></dialog>
<dialog id="add-dialog"><form method="dialog"><h2>添加媒体库</h2><label>类型<select id="kind"><option value="all">音乐和视频</option><option value="music">音乐</option><option value="video">视频</option></select></label><menu><button value="cancel">取消</button><button value="add" class="primary">选择文件夹</button></menu></form></dialog>
<dialog id="share-dialog"><div class="dialog-title"><h2>局域网共享</h2><button id="share-close" aria-label="关闭共享设置">×</button></div><p id="share-state">未开启</p><label>端口<input id="port" type="number" min="1024" max="65535" value="8098"></label><div id="share-links"></div><p class="hint">仅在可信局域网使用；停止共享后链接失效。</p><p id="share-error" role="status"></p><div class="dialog-actions"><button id="share-stop" hidden>停止共享</button><button id="share-start" class="primary">开启共享</button></div></dialog><script src="app.js"></script></body></html>
