<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影音库</title><link rel="icon" href="data:,"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="web-header"><div class="web-brand"><span data-icon="disc"></span><strong>影音库</strong></div><span class="web-label">播放器</span><button id="theme" class="icon-button" aria-label="切换主题" title="切换主题"><span data-icon="sun"></span></button></header>
<main><section id="locked" hidden><div class="empty-record"><span data-icon="share"></span></div><h1>连接媒体库</h1><form id="connect"><input id="key" type="password" placeholder="粘贴分享链接" aria-label="分享链接" required><button class="primary">连接</button></form><p id="auth-error" role="status"></p></section>
<div id="app" hidden>
<section id="playing" hidden>
 <div class="player-actions"><button id="queue-toggle" class="quiet" aria-controls="queue-dialog" aria-expanded="false" title="播放列表"><span data-icon="list"></span><span class="queue-label">播放列表</span><span id="queue-count">0</span></button><button id="hide-player" class="quiet"><span data-icon="down"></span><span>收起播放器</span></button></div>
 <div id="music-art" class="art" hidden></div><video id="video" controls playsinline preload="metadata" hidden></video><audio id="audio" preload="metadata" hidden></audio>
 <div class="track-panel"><div class="player-heading"><small id="playing-kind"></small><h1 id="playing-name"></h1><p id="playing-meta"></p></div>
 <button id="play-gate" class="primary" hidden><span data-icon="play"></span>点击开始播放</button>
 <div id="transport" hidden><div class="tp-line seek-line"><span id="tp-now">0:00</span><input id="tp-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度"><span id="tp-total">0:00</span></div><div class="tp-row"><button id="tp-prev" class="icon-button" aria-label="上一首" title="上一首"><span data-icon="previous"></span><span class="transport-label">上一首</span></button><button id="tp-toggle" class="icon-button" aria-label="播放" title="播放 / 暂停"><span data-icon="play"></span></button><button id="tp-next" class="icon-button" aria-label="下一首" title="下一首"><span data-icon="next"></span><span class="transport-label">下一首</span></button></div><div class="tp-line tp-small"><button id="tp-mute" class="icon-button" aria-label="静音" title="静音"><span data-icon="volume"></span></button><input id="tp-volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量"></div></div>
 <div class="playback"><button id="previous" class="quiet">上一首</button><button id="next-track" class="quiet">下一首</button><button id="mode" class="quiet" title="播放模式">顺序播放</button><button id="bookmark" class="quiet">收藏</button><label>速度 <select id="speed" aria-label="播放速度"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><span id="resume"></span></div><p id="player-error" role="status"></p></div>
</section>
<section class="browser"><div class="browser-title"><div><span class="eyebrow">本地媒体库</span><h1>音乐与视频</h1></div><span id="count"></span><button id="refresh" class="icon-button" title="刷新" aria-label="刷新"><span data-icon="refresh"></span></button></div>
<nav><div class="tabs"><button data-kind="all" class="selected">全部</button><button data-kind="music">音乐</button><button data-kind="video">视频</button><button id="favorites">收藏</button></div><input id="search" maxlength="128" aria-label="搜索媒体" placeholder="搜索名称、歌手、专辑"><select id="library" aria-label="媒体库"><option value="">所有媒体库</option></select><select id="playlist" aria-label="歌单"><option value="">所有歌单</option></select></nav><p id="error" role="status"></p><div id="items" class="grid"></div><button id="more" hidden>加载更多</button></section>
</div></main>
<dialog id="queue-dialog" aria-labelledby="queue-title"><div class="queue-header"><div><h2 id="queue-title">播放列表</h2><p id="queue-source"></p></div><button id="queue-close" class="icon-button" aria-label="关闭播放列表"><span data-icon="close"></span></button></div><div class="queue-toolbar"><span id="queue-summary"></span><button id="queue-locate" class="quiet">定位当前</button></div><ol id="queue-items"></ol><div class="queue-footer"><p id="queue-error" role="status"></p><button id="queue-more" class="quiet" hidden>加载更多</button></div></dialog>
<script src="queue.js"></script><script src="ui.js"></script><script src="app.js"></script></body></html>
