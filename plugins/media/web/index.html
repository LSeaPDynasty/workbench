<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影音库</title><link rel="icon" href="data:,"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head><body>
<header><strong>影音库</strong><span>播放器</span><button id="theme" aria-label="切换主题">◐</button></header>
<main><section id="locked" hidden><h1>连接媒体库</h1><form id="connect"><input id="key" type="password" placeholder="粘贴分享链接" aria-label="分享链接" required><button>连接</button></form><p id="auth-error" role="status"></p></section>
<div id="app" hidden><section id="playing" hidden><div class="player-heading"><div><small id="playing-kind"></small><h1 id="playing-name"></h1><p id="playing-meta"></p></div><button id="hide-player">关闭播放</button></div><button id="play-gate" type="button" hidden><b>▶ 点击开始播放</b><small>浏览器要求先点一下才能出声</small></button><video id="video" controls playsinline preload="metadata" hidden></video><div id="music-art" hidden>♫</div><audio id="audio" preload="metadata" hidden></audio><div id="transport" hidden><div class="tp-row"><button id="tp-prev" type="button" aria-label="上一首" title="上一首">⏮</button><button id="tp-toggle" type="button" aria-label="播放/暂停" title="播放/暂停">▶</button><button id="tp-next" type="button" aria-label="下一首" title="下一首">⏭</button></div><div class="tp-line"><span id="tp-now">0:00</span><input id="tp-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度"><span id="tp-total">0:00</span></div><div class="tp-line tp-small"><button id="tp-mute" type="button" aria-label="静音" title="静音">🔊</button><input id="tp-volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量"></div></div><div class="playback"><button id="previous">上一首</button><button id="next-track">下一首</button><button id="mode" title="播放模式">顺序播放</button><button id="bookmark">☆ 收藏</button><label>速度 <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><span id="resume"></span></div><p id="player-error" role="status"></p></section>
<nav><div class="tabs"><button data-kind="all" class="selected">全部</button><button data-kind="music">音乐</button><button data-kind="video">视频</button><button id="favorites">收藏</button></div><input id="search" aria-label="搜索媒体" placeholder="搜索名称、歌手、专辑"><select id="library" aria-label="媒体库"><option value="">所有媒体库</option></select><select id="playlist" aria-label="歌单"><option value="">所有歌单</option></select></nav><div class="list-info"><span id="count"></span><button id="refresh">刷新</button></div><p id="error" role="status"></p><div id="items" class="grid"></div><button id="more" hidden>加载更多</button></div></main><script src="app.js"></script></body></html>
