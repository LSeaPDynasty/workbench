<!doctype html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>影音库</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head><body>
<header><strong>影音库</strong><span>播放器</span><button id="theme" aria-label="切换主题">◐</button></header>
<main><section id="locked" hidden><h1>连接媒体库</h1><form id="connect"><input id="key" type="password" placeholder="粘贴分享链接" aria-label="分享链接" required><button>连接</button></form><p id="auth-error" role="status"></p></section>
<div id="app" hidden><section id="playing" hidden><div class="player-heading"><div><small id="playing-kind"></small><h1 id="playing-name"></h1><p id="playing-meta"></p></div><button id="hide-player">关闭播放</button></div><video id="video" controls playsinline preload="metadata" hidden></video><div id="music-art" hidden>♫</div><audio id="audio" controls preload="metadata" hidden></audio><div class="playback"><button id="previous">上一首</button><button id="next-track">下一首</button><button id="bookmark">☆ 收藏</button><label>速度 <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><span id="resume"></span></div><p id="player-error" role="status"></p></section>
<nav><div class="tabs"><button data-kind="all" class="selected">全部</button><button data-kind="music">音乐</button><button data-kind="video">视频</button><button id="favorites">收藏</button></div><input id="search" aria-label="搜索媒体" placeholder="搜索名称、歌手、专辑"><select id="library" aria-label="媒体库"><option value="">所有媒体库</option></select></nav><div class="list-info"><span id="count"></span><button id="refresh">刷新</button></div><p id="error" role="status"></p><div id="items" class="grid"></div><button id="more" hidden>加载更多</button></div></main><script src="app.js"></script></body></html>
