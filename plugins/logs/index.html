<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head><body><header><strong id="name">日志查看器</strong><span>只读</span><button id="refresh" disabled>刷新</button></header><div class="toolbar"><select id="level" aria-label="日志级别"><option value="ALL">全部级别</option><option>TRACE</option><option>DEBUG</option><option>INFO</option><option>NOTICE</option><option>WARN</option><option>ERROR</option><option>FATAL</option><option value="UNKNOWN">未知</option></select><input id="query" placeholder="搜索" aria-label="搜索日志"><label><input id="wrap" type="checkbox">折行</label><button id="end">末尾</button><span id="summary"></span></div><p id="error" role="status"></p><div id="content"><p class="empty">未打开文件</p></div><footer><span id="status"></span><button id="prev" disabled>上一页</button><span id="page"></span><button id="next" disabled>下一页</button></footer><script src="parser.js"></script><script src="app.js"></script></body></html>
