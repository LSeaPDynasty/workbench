<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据库</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head><body>
<aside><header><strong>数据库</strong><button id="new" aria-label="新建连接">＋</button></header><div class="section">连接</div><nav id="connections"></nav><footer><span id="connection-count">0 个连接</span></footer></aside>
<main><header class="top"><div><h1 id="title">数据库</h1><span id="address" class="muted">未选择连接</span></div><div class="actions"><span id="state" class="badge">未连接</span><button id="edit" disabled>编辑连接</button><button id="connect" disabled class="primary">连接</button></div></header>
<div id="notice" role="status" aria-live="polite"></div><section id="empty" class="empty"><div class="database-icon">▤</div><h2>还没有连接</h2><p>添加 MySQL 或 Redis 连接</p><button id="empty-new" class="primary">新建连接</button></section>
<section id="workspace" hidden><div class="browser"><div class="browser-head"><strong id="objects-title">数据表</strong><button id="refresh" aria-label="刷新对象">↻</button></div><input id="filter" aria-label="筛选对象" placeholder="筛选数据表"><div id="objects"></div><button id="new-key" hidden>新建字符串键</button><button id="more-keys" hidden>继续扫描</button></div><div class="content"><div class="tabs" role="tablist"><button id="data-tab" role="tab" aria-selected="true">数据</button><button id="schema-tab" role="tab" aria-selected="false">结构</button><button id="query-tab" role="tab" aria-selected="false">SQL 查询</button></div><div id="query-panel" hidden><label for="sql">SQL</label><textarea id="sql" spellcheck="false" placeholder="输入 SQL，Ctrl+Enter 执行"></textarea><div class="query-actions"><span class="muted">单条语句 · 最多显示 500 行</span><button id="run" class="primary">执行 SQL</button></div></div><div id="redis-panel" hidden><div class="value-heading"><strong id="key-name"></strong><span id="key-meta" class="badge"></span></div><textarea id="value" aria-label="键值" spellcheck="false"></textarea><div class="query-actions"><label>有效期（秒，-1 为永久）<input id="ttl" type="number" min="-1" value="-1"></label><button id="save-value" class="primary">保存字符串</button><button id="delete-key" class="danger">删除键</button></div></div><div id="result" class="result"><div class="empty">选择左侧对象以查看数据</div></div><div class="result-footer"><span id="result-info">未执行查询</span><div><button id="prev" disabled>上一页</button><button id="next" disabled>下一页</button></div></div></div></section></main>
<dialog id="connection-dialog"><form id="connection-form"><div class="dialog-heading"><h2 id="dialog-title">新建连接</h2><button type="button" id="close-dialog" aria-label="关闭">×</button></div><label>连接名称<input name="name" required maxlength="256" autocomplete="off"></label><label>数据库类型<select name="kind"><option value="mysql">MySQL</option><option value="redis">Redis</option></select></label><div class="fields"><label>主机<input name="host" required value="127.0.0.1" maxlength="256"></label><label>端口<input name="port" type="number" min="1" max="65535" required value="3306"></label></div><label>用户名<input name="user" maxlength="256" autocomplete="off"></label><label>密码<input name="password" type="password" maxlength="4096" autocomplete="off"><span class="muted">仅用于当前会话，不保存</span></label><label id="database-label">数据库<input name="database" maxlength="256" required></label><label class="check"><input name="tls" type="checkbox">使用 TLS（验证服务器证书）</label><p id="form-status" role="status"></p><menu><button id="remove-connection" type="button" class="danger" hidden>删除连接</button><button id="test" type="button">测试连接</button><button type="submit" class="primary">保存连接</button></menu></form></dialog>
<dialog id="password-dialog"><form method="dialog"><h2>连接数据库</h2><label>密码<input id="session-password" type="password" maxlength="4096" autocomplete="off"></label><p class="muted">密码仅用于当前会话</p><menu><button value="cancel">取消</button><button value="connect" class="primary">连接</button></menu></form></dialog>
<dialog id="key-dialog"><form id="key-form"><h2>新建字符串键</h2><label>键名<input id="new-key-name" required maxlength="4096"></label><label>值<textarea id="new-key-value" maxlength="48000"></textarea></label><label>有效期（秒，-1 为永久）<input id="new-key-ttl" type="number" value="-1" min="-1" required></label><menu><button id="cancel-key" type="button">取消</button><button type="submit" class="primary">创建</button></menu></form></dialog><dialog id="confirm-dialog"><form method="dialog"><h2>确认操作</h2><p id="confirm-message"></p><menu><button value="cancel">取消</button><button value="confirm" class="primary">确认</button></menu></form></dialog><script src="app.js"></script></body></html>
